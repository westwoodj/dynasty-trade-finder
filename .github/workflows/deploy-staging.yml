# .github/workflows/deploy-staging.yml - Deploy to staging on PR
name: Deploy to Staging

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "projects/1082242810099/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "github-deployer@dynasty-trade-finder.iam.gserviceaccount.com"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker
        run: gcloud auth configure-docker us-east1-docker.pkg.dev --quiet

      - name: Build and Push
        run: |
          docker build -t us-east1-docker.pkg.dev/${{ env.PROJECT_ID }}/cloud-run-images/dynasty-trade-staging:pr-${{ github.event.number }} .
          docker push us-east1-docker.pkg.dev/${{ env.PROJECT_ID }}/cloud-run-images/dynasty-trade-staging:pr-${{ github.event.number }}

      # Check if the Cloud Run service already exists.
      # --no-traffic is only valid when updating an existing service,
      # not when creating one for the first time.
      - name: Check if Cloud Run service exists
        id: service-check
        run: |
          if gcloud run services describe dynasty-trade-staging --region us-east1 --format="value(name)" 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Deploy with a revision tag for testing
      - name: Deploy to staging
        id: deploy-staging
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: dynasty-trade-staging
          image: us-east1-docker.pkg.dev/${{ env.PROJECT_ID }}/cloud-run-images/dynasty-trade-staging:pr-${{ github.event.number }}
          region: us-east1
          tag: pr-${{ github.event.number }}
          no_traffic: ${{ steps.service-check.outputs.exists == 'true' }}
          # Inject API keys from Secret Manager as env vars (values never touch
          # this YAML or the image). config.py reads these names from os.environ.
          # The DATABASE_URL line is only emitted when the DATABASE_URL_SECRET
          # repo variable is set (to the Secret Manager secret name, e.g.
          # `database-url`); until then it resolves to a blank line and the app
          # uses its SQLite fallback.
          secrets: |
            PARSE_API_KEY=parse-api-key:latest
            SPORTSDATA_API_KEY=sportsdata-api-key:latest
            ${{ vars.DATABASE_URL_SECRET && format('DATABASE_URL={0}:latest', vars.DATABASE_URL_SECRET) || '' }}
          # session-affinity keeps a browser pinned to one instance so Streamlit's
          # websocket stays put; the memory bump avoids OOM while loading the NFL
          # player list + nflverse stats; 3600s timeout keeps long sockets open.
          flags: >-
            --memory=2Gi
            --cpu=1
            --timeout=3600
            --session-affinity

      # The deploy-cloudrun action does not grant public access, so anonymous
      # requests to the preview URL get a 403. Grant allUsers the invoker role
      # so reviewers can open the preview. This is idempotent.
      - name: Allow unauthenticated access
        run: |
          gcloud run services add-iam-policy-binding dynasty-trade-staging \
            --region=us-east1 \
            --member=allUsers \
            --role=roles/run.invoker \
            --project=${{ env.PROJECT_ID }}

      - name: Comment PR with preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const url = `${{ steps.deploy-staging.outputs.url }}`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Preview deployed to: ${url}`
            });

    env:
      PROJECT_ID: dynasty-trade-finder
