# .github/workflows/deploy-staging.yml - Deploy to staging on PR
name: Deploy to Staging

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "projects/1082242810099/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "github-deployer@dynasty-trade-finder.iam.gserviceaccount.com"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker
        run: gcloud auth configure-docker us-east1-docker.pkg.dev --quiet

      - name: Build and Push
        run: |
          docker build -t us-east1-docker.pkg.dev/${{ env.PROJECT_ID }}/cloud-run-images/my-app:pr-${{ github.event.number }} .
          docker push us-east1-docker.pkg.dev/${{ env.PROJECT_ID }}/cloud-run-images/my-app:pr-${{ github.event.number }}

      # Check if the Cloud Run service already exists.
      # --no-traffic is only valid when updating an existing service,
      # not when creating one for the first time.
      - name: Check if Cloud Run service exists
        id: service-check
        run: |
          if gcloud run services describe my-app --region us-east1 --format="value(name)" 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Deploy with a revision tag for testing
      - name: Deploy to staging
        id: deploy-staging
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: my-app
          image: us-east1-docker.pkg.dev/${{ env.PROJECT_ID }}/cloud-run-images/my-app:pr-${{ github.event.number }}
          region: us-east1
          tag: pr-${{ github.event.number }}
          no_traffic: ${{ steps.service-check.outputs.exists == 'true' }}

      - name: Comment PR with preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const url = `${{ steps.deploy-staging.outputs.url }}`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Preview deployed to: ${url}`
            });

    env:
      PROJECT_ID: dynasty-trade-finder
