# .github/workflows/deploy.yml - Deploy to Cloud Run on push to main
name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

# Required for Workload Identity Federation
permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: dynasty-trade-finder
  REGION: us-east1
  SERVICE_NAME: dynasty-trade-finder
  REGISTRY: us-east1-docker.pkg.dev
  REPOSITORY: cloud-run-images

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Check out the repository code
      - name: Checkout
        uses: actions/checkout@v4

      # Authenticate to GCP using Workload Identity Federation
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "projects/1082242810099/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "github-deployer@dynasty-trade-finder.iam.gserviceaccount.com"

      # Set up gcloud CLI
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      # Configure Docker to use gcloud for authentication
      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      # Build the Docker image
      - name: Build
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:latest \
            .

      # Push to Artifact Registry
      - name: Push
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:latest

      # Deploy to Cloud Run
      #
      # Cloud SQL wiring is opt-in via the CLOUD_SQL_INSTANCE repo variable
      # (Settings > Secrets and variables > Actions > Variables). While it's
      # unset the app falls back to its bundled SQLite file, so deploys keep
      # working before the database is provisioned. Once set, the service
      # mounts the Cloud SQL socket and the app connects to Postgres. Requires
      # a `db-password` secret and the `dtf` user/database (see README).
      - name: Deploy
        env:
          CLOUD_SQL_INSTANCE: ${{ vars.CLOUD_SQL_INSTANCE }}
        run: |
          secrets="PARSE_API_KEY=parse-api-key:latest,SPORTSDATA_API_KEY=sportsdata-api-key:latest"
          extra=()
          if [ -n "$CLOUD_SQL_INSTANCE" ]; then
            echo "Wiring Cloud SQL instance: $CLOUD_SQL_INSTANCE"
            extra+=(--add-cloudsql-instances="$CLOUD_SQL_INSTANCE")
            extra+=(--set-env-vars="INSTANCE_CONNECTION_NAME=$CLOUD_SQL_INSTANCE,DB_USER=dtf,DB_NAME=dtf")
            secrets="$secrets,DB_PASS=db-password:latest"
          else
            echo "CLOUD_SQL_INSTANCE not set — deploying with the SQLite fallback."
          fi
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --memory=2Gi \
            --cpu=1 \
            --timeout=3600 \
            --session-affinity \
            --min-instances=1 \
            --set-secrets="$secrets" \
            "${extra[@]}"

      # Output the service URL
      - name: Show URL
        run: |
          echo "Service URL:"
          gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --format="value(status.url)"