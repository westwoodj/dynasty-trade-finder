# .github/workflows/deploy.yml - Deploy to Cloud Run on push to main
name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

# Required for Workload Identity Federation
permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: dynasty-trade-finder
  REGION: us-east1
  SERVICE_NAME: dynasty-trade-finder
  REGISTRY: us-east1-docker.pkg.dev
  REPOSITORY: cloud-run-images

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Check out the repository code
      - name: Checkout
        uses: actions/checkout@v4

      # Authenticate to GCP using Workload Identity Federation
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "projects/1082242810099/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "github-deployer@dynasty-trade-finder.iam.gserviceaccount.com"

      # Set up gcloud CLI
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      # Configure Docker to use gcloud for authentication
      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      # Build the Docker image
      - name: Build
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:latest \
            .

      # Push to Artifact Registry
      - name: Push
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:latest

      # Deploy to Cloud Run
      #
      # The managed Postgres (Neon) connection string lives in Secret Manager;
      # wiring it is opt-in via the DATABASE_URL_SECRET repo variable
      # (Settings > Secrets and variables > Actions > Variables), set to the
      # secret's name (e.g. `database-url`). While it's unset the app falls back
      # to its ephemeral SQLite file, so deploys keep working before the
      # database is provisioned. Once set, DATABASE_URL is injected as an env
      # var and src/db/engine.py connects to Neon over TLS. See README.
      - name: Deploy
        env:
          DATABASE_URL_SECRET: ${{ vars.DATABASE_URL_SECRET }}
        run: |
          secrets="PARSE_API_KEY=parse-api-key:latest,SPORTSDATA_API_KEY=sportsdata-api-key:latest"
          if [ -n "$DATABASE_URL_SECRET" ]; then
            echo "Wiring managed Postgres via Secret Manager secret: $DATABASE_URL_SECRET"
            secrets="$secrets,DATABASE_URL=$DATABASE_URL_SECRET:latest"
          else
            echo "DATABASE_URL_SECRET not set — deploying with the SQLite fallback."
          fi
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --memory=2Gi \
            --cpu=1 \
            --timeout=3600 \
            --session-affinity \
            --min-instances=1 \
            --set-secrets="$secrets"

      # Output the service URL
      - name: Show URL
        run: |
          echo "Service URL:"
          gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --format="value(status.url)"