[project]
name = "dynasty-trade-finder"
version = "0.1.0"
description = "Dynasty Superflex PPR fantasy football trade analysis tool"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "parse-apis",
    "parse-sdk>=0.2.0",
    "requests>=2.34.2",
    "streamlit>=1.60.0",
    "sqlmodel>=0.0.39",
    "nflreadpy>=0.1.5",
    "python-dotenv>=1.2.2",
    "pg8000>=1.31",
    "polars>=1.43.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
]

[tool.uv.sources]
parse-apis = { path = "parse_apis", editable = true }

